name: short-it

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shortit
      POSTGRES_USER: shortit
      POSTGRES_PASSWORD: shortit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortit -d shortit"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [private]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://shortit:shortit@postgres:5432/shortit?schema=public
      BETTER_AUTH_SECRET: local-development-secret-change-before-sharing
      BETTER_AUTH_URL: http://app.localhost:8080
      TRUSTED_ORIGINS: http://app.localhost:8080
      APP_BASE_DOMAIN: localhost
      PORT: 3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./:/workspace
      - api-node-modules:/workspace/node_modules
    networks: [private]

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    command: pnpm --filter @short-it/api prisma:migrate:deploy
    environment:
      DATABASE_URL: postgresql://shortit:shortit@postgres:5432/shortit?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    environment:
      VITE_API_BASE_URL: /api
    volumes:
      - ./:/workspace
      - web-node-modules:/workspace/node_modules
    networks: [private]

  edge:
    image: caddy:2.10.2-alpine
    ports:
      - "8080:8080"
    depends_on: [api, web]
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      private:
        aliases: [app.localhost]

volumes:
  postgres-data:
  api-node-modules:
  web-node-modules:

networks:
  private:
    driver: bridge
