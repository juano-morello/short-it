name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @short-it/e2e exec playwright install --with-deps chromium
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm coverage
      - run: pnpm db:validate
      - run: pnpm storybook:build
      - run: pnpm compose:config
      - run: pnpm docker:build
      - run: pnpm security
      - run: docker compose up -d --build
      - name: Wait for the local API
        run: bash scripts/wait-for-local-stack.sh
      - name: Build the production API image
        run: docker build --target production --tag short-it-api-production-test --file apps/api/Dockerfile .
      - name: Smoke-test invitation pruning in the production API image
        run: >-
          docker run --rm --network short-it_private
          -e ANALYTICS_VISITOR_SECRET=abcdef0123456789abcdef0123456789
          -e APP_BASE_DOMAIN=example.test
          -e BETTER_AUTH_SECRET=0123456789abcdef0123456789abcdef
          -e BETTER_AUTH_URL=https://app.example.test
          -e DATABASE_URL=postgresql://shortit:shortit@postgres:5432/shortit?schema=public
          -e TRUSTED_ORIGINS=https://app.example.test
          short-it-api-production-test node apps/api/dist/auth/prune-invitations.js
      - run: BDD_BASE_URL=http://app.localhost:8080 pnpm bdd
      - name: Restart the local API for workspace invitations
        run: docker compose restart api
      - name: Wait for the local API before workspace invitations
        run: bash scripts/wait-for-local-stack.sh
      - run: BDD_BASE_URL=http://app.localhost:8080 pnpm bdd:invitations
      - name: Restart the local API for invitation edge cases
        run: docker compose restart api
      - name: Wait for the local API before invitation edge cases
        run: bash scripts/wait-for-local-stack.sh
      - run: BDD_BASE_URL=http://app.localhost:8080 pnpm bdd:invitation-edge
      - name: Restart the local API for analytics overview
        run: docker compose restart api
      - name: Wait for the local API before analytics overview
        run: bash scripts/wait-for-local-stack.sh
      - run: BDD_BASE_URL=http://app.localhost:8080 pnpm bdd:analytics
      - name: Restart the local API for publication guardrails
        run: docker compose restart api
      - name: Wait for the local API before publication guardrails
        run: bash scripts/wait-for-local-stack.sh
      - run: BDD_BASE_URL=http://app.localhost:8080 pnpm bdd:publication-guardrails
      - name: Restart the local stack for the rate-limit scenario
        run: docker compose down --volumes && docker compose up -d --build
      - name: Wait for the local stack
        run: bash scripts/wait-for-local-stack.sh
      - run: BDD_BASE_URL=http://app.localhost:8080 pnpm bdd:rate-limit
      - name: Restart the local stack for browser tests
        run: docker compose down --volumes && docker compose up -d --build
      - name: Wait for the local stack before browser tests
        run: bash scripts/wait-for-local-stack.sh
      - run: pnpm e2e
      - if: failure()
        run: docker compose ps && docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
